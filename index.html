    <meta property="og:type" content="website" />

      property="og:description"
      content="从建模、材质、灯光到动画与合成，把每一台产品讲成一个值得相信的故事。"

  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages 404 回退：把 ?/work/aura 还原成真实路径
      ;(function () {
        var search = window.location.search
        if (search.indexOf('?/') !== 0) return
        var raw = search.slice(2)
        var hash = ''
        var hashAt = raw.indexOf('#')
        if (hashAt >= 0) {
          hash = raw.slice(hashAt)
          raw = raw.slice(0, hashAt)
        }
        window.history.replaceState(null, '', '%BASE_URL%' + raw + hash)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
